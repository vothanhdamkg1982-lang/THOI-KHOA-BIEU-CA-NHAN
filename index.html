<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TKB cá nhân - GV Đậm</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div class="app"><header><div><h1>THỜI KHÓA BIỂU CÁ NHÂN</h1><p>Giáo viên: <b>ĐẬM</b></p></div><label class="upload">📂 TẢI / CẬP NHẬT TKB<input id="fileInput" type="file" accept=".xlsx,.xls"></label></header>
<section id="fileInfo" class="info">Chưa tải file Excel.</section><section class="auth-bar"><div id="supabaseStatus" class="info auth-status">☁️ Supabase: đang kiểm tra kết nối...</div><div class="auth-actions"><span id="authUserLabel" class="auth-user"></span><button id="loginBtn" type="button">👤 ĐĂNG NHẬP GIÁO VIÊN</button><button id="logoutBtn" type="button" class="auth-logout" hidden>ĐĂNG XUẤT</button></div></section>
<section class="pl2-panel"><div><b>PHỤ LỤC 2 – KẾ HOẠCH DẠY HỌC</b><small id="pl2Info">Chưa tải Phụ lục 2.</small></div><label class="week-select">TKB hiệu lực từ <select id="effectiveFromWeek"></select></label><label class="upload secondary">📘 TẢI PHỤ LỤC 2<input id="pl2Input" type="file" accept=".docx,.xlsx,.xls"></label><label class="week-select">Tuần <select id="weekSelect"></select></label><button id="calendarBtn" type="button">📅 LỊCH NĂM HỌC</button><button id="repoBtn" type="button">🗂 QUẢN LÝ KHO TKB</button><button id="appendix2RepoBtn" type="button">📚 KHO PHỤ LỤC 2</button><label class="week-select">Tiết kiêm nhiệm <input id="concurrentPeriods" type="number" min="0" step="1" value="0" inputmode="numeric" style="width:72px"></label></section>
<section id="pl2Match" class="info pl2-match">Tải Phụ lục 2 và chọn tuần để ghép tên bài học.</section>
<section id="stats" class="stats"></section>
<section class="toolbar"><select id="fThu"><option value="">Tất cả Thứ</option></select><select id="fBuoi"><option value="">Tất cả Buổi</option><option>Sáng</option><option>Chiều</option></select><select id="fPoint"><option value="">Tất cả điểm trường</option></select><select id="fClass"><option value="">Tất cả lớp</option></select><button id="tableBtn">Dạng bảng</button><button id="weekBtn">Lịch tuần</button><span class="spacer"></span><button id="excelBtn">Xuất Excel</button><button id="pdfBtn">Xuất PDF</button><button id="printBtn">In Phụ lục 1.4</button></section>
<section id="scan" class="scan"></section><section id="errors"></section>
<main id="view"></main></div><script src="app.js"></script></body></html>
